about:
  title: "About me"
  description: |
    I'm a frontend and creative developer who likes interfaces that feel expressive, useful and fast.

    I sketch in Figma before I code, I love open source and creative coding, and I'm happiest where tech bumps into music and digital art.

    After work I make games in Godot. Runewheel is the first one I'm determined to finish.
