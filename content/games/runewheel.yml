title: Runewheel
slug: runewheel
tagline: A macabre roguelike fought on a wheel of runes.
description: Head down through the Crypt, the Ossuary, the Pit and the Clock's heart, one room at a time. Every fight is a little machine of two rings, so turn yours, read theirs and make every step count. Spooky, a bit cruel, and very fun to break.
status: In development
version: 0.30 alpha
engine: Godot 4
platforms: [Windows, macOS, Linux, Web, Android, iOS]
tags: [roguelike, turn-based, pixel art, dark fantasy]
