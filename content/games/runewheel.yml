devlog:
  - "Oct 16: Gold just counts now. The shop and the spoils stopped throwing coins around."
  - "Oct 15: The Fog became a trait, carried by the Saint, the Ossuary lord and the Executioner."
  - "Oct 14: A Daily run with the same seed for everyone, and a History of every run you've played."
  - "Oct 14: Version 0.30. Echo chains, hit pauses, cards dealt face down, a slow-mo when a boss falls."
  - "Oct 14: An exact kill, a blow that leaves the enemy at precisely zero, doubles the bounty."
  - "Oct 14: Pick how much shake and sparkle you want, or turn motion down altogether."
  - "Oct 14: Phones buzz on blows, deaths and big plans."
date: 2026-10-01
